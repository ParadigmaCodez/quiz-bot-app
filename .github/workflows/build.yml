name: Build Android Floating Quiz Bot APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build Log Check
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "Building Quiz Bot APK with secure GEMINI_API_KEY..."
        node bot.js

    - name: Upload Artifact (APK/Script Output)
      uses: actions/upload-artifact@v3
      with:
        name: QuizBot-Build
        path: bot.js

